name: android
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl pillow
      - name: 데이터 검증
        run: python3 tools/build_data.py && python3 tools/audit.py
      # GitHub ubuntu 러너에는 Android SDK(ANDROID_HOME)가 이미 있다. AGP 가 필요한 platform·build-tools 를 받는다
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위·스크린샷 테스트
        run: cd android && ./gradlew --no-daemon testDebugUnitTest
      - name: 릴리스 빌드(서명 없음, R8 검증)
        run: cd android && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/roborazzi/*.png
            android/app/build/reports/tests/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install openpyxl pillow
      - name: 웹 데이터 내보내기 누락 검사
        working-directory: .
        run: python3 tools/build_data.py && python3 tools/export_web.py && git diff --exit-code data/web
      - run: npm ci
      - run: npx vitest run
      - name: 빌드(CI 는 시험용 이메일로 암호화)
        run: npm run build
        env:
          ALLOWED_EMAILS: ci@example.com
