name: android
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - name: 데이터 검증
        run: python3 tools/build_data.py
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위·스크린샷 테스트
        run: cd android && ./gradlew --no-daemon testDebugUnitTest
      - name: 릴리스 빌드(서명 없음, R8 검증)
        run: cd android && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/roborazzi/*.png
            android/app/build/reports/tests/
